spring:
  application:
    name: forcamente-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forcamente}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}



  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:4}

logging:
  level:
    forcamente.api: ${LOG_NIVEL:INFO}

jwt:
  segredo: ${JWT_SECRET}
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}

cifra-de-email:
  chave: ${EMAIL_CHAVE_CIFRA}
  chave-indice: ${EMAIL_CHAVE_INDICE}

cors:
  origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

limite-por-ip:
  requisicoes: ${LIMITE_POR_IP_REQUISICOES:20}
  janela-minutos: ${LIMITE_POR_IP_JANELA_MINUTOS:5}

viacep:
  url: ${VIACEP_URL:https://viacep.com.br/ws}

auditoria:
  retencao-meses: ${AUDITORIA_RETENCAO_MESES:6}
