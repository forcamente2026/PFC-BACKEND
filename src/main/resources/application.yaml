spring:
  application:
    name: forcamente-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forcamente}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}



  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


server:
  port: 8080

logging:
  level:
    forcamente.api: DEBUG

jwt:
  segredo: ${JWT_SECRET:forcamente-segredo-de-desenvolvimento-troque-em-producao}
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}

viacep:
  url: ${VIACEP_URL:https://viacep.com.br/ws}

auditoria:
  retencao-meses: ${AUDITORIA_RETENCAO_MESES:6}